name: Render Daily Report

on:
  schedule:
    # 8:00 AM everyday in Vietnam Time (UTC+7) corresponds to 1:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  render-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # Enables fast R package binary downloads on Linux

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("jsonlite", "glue", "tidyverse", "plotly", "dotenv"))'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler CLI
        run: npm install -g wrangler

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          quarto render report.qmd

      - name: Upload Report HTML as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report
          path: report.html

      - name: Commit and push updated report.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add report.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily report [skip ci]" && git push)
